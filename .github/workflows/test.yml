name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # manual run from the Actions tab
  workflow_dispatch:

# cancel an older run of the same branch when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests (Mocha)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run all API tests
        run: docker compose --profile ci run --rm --build test

      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile ci logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose --profile "*" down -v

  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run all UI tests
        run: docker compose --profile e2e run --rm --build playwright

      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile e2e logs --no-color app frontend

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker compose --profile "*" down -v

  # Swagger docs are published only from main and only when all tests passed
  deploy-swagger:
    name: Deploy Swagger docs to GitHub Pages
    needs: [ api-tests, ui-tests ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (for Swagger build)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (for Swagger build)
        run: npm ci

      - name: Build Swagger documentation
        run: npm run build:swagger

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: docs
          commit_message: 'Deploy Swagger documentation'
