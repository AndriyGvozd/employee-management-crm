name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # manual run from the Actions tab
  workflow_dispatch:

# cancel an older run of the same branch when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests (Mocha)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run all API tests
        run: docker compose --profile ci run --rm --build test npm run test:report

      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile ci logs --no-color

      - name: Upload API HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: reports/api/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker compose --profile "*" down -v

  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run all UI tests
        run: docker compose --profile e2e run --rm --build playwright

      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile e2e logs --no-color app frontend

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker compose --profile "*" down -v

  # Swagger docs are published only from main and only when all tests passed
  deploy-swagger:
    name: Deploy Swagger docs to GitHub Pages
    needs: [ api-tests, ui-tests ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (for Swagger build)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (for Swagger build)
        run: npm ci

      - name: Build Swagger documentation
        run: npm run build:swagger

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: docs
          commit_message: 'Deploy Swagger documentation'

  # Test reports are published to GitHub Pages from main even when tests fail
  publish-reports:
    name: Publish test reports to GitHub Pages
    needs: [ api-tests, ui-tests, deploy-swagger ]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download API report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: api-report
          path: site/api

      - name: Download UI report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: site/ui

      - name: Build reports index page
        env:
          API_RESULT: ${{ needs.api-tests.result }}
          UI_RESULT: ${{ needs.ui-tests.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          badge() { [ "$1" = success ] && echo "✅ passed" || echo "❌ $1"; }
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Test reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #24292f; }
              table { border-collapse: collapse; width: 100%; }
              td, th { border: 1px solid #d0d7de; padding: 10px; text-align: left; }
              a { color: #0969da; }
            </style>
          </head>
          <body>
            <h1>Test reports</h1>
            <p>Branch <b>${GITHUB_REF_NAME}</b>, commit <a href="${COMMIT_URL}">${GITHUB_SHA::7}</a>,
               <a href="${RUN_URL}">workflow run #${GITHUB_RUN_NUMBER}</a>, $(date -u '+%Y-%m-%d %H:%M UTC')</p>
            <table>
              <tr><th>Suite</th><th>Result</th><th>Report</th></tr>
              <tr><td>API tests (Mocha)</td><td>$(badge "$API_RESULT")</td><td><a href="api/">Open</a></td></tr>
              <tr><td>UI tests (Playwright)</td><td>$(badge "$UI_RESULT")</td><td><a href="ui/">Open</a></td></tr>
            </table>
            <p><a href="../docs/">API documentation</a></p>
          </body>
          </html>
          EOF

      - name: Deploy reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: reports
          commit_message: 'Publish test reports'

      - name: Add reports link to run summary
        run: |
          echo "### Test reports" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/" >> "$GITHUB_STEP_SUMMARY"
