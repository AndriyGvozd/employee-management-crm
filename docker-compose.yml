services:
  app:
    build: .
    container_name: my_app
    env_file:
      # committed defaults; optional local file overrides them
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: my_frontend
    env_file:
      # committed defaults; optional local file overrides them
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    image: postgres:16
    container_name: my_db
    env_file:
      # committed defaults; optional local file overrides them
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build: .
    container_name: my_test
    env_file:
      # committed defaults; optional local file overrides them
      - path: .env.test.example
      - path: .env.test
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    entrypoint: ["/entrypoint-test.sh"]
    command: npm run test
    profiles:
      - ci

  # Playwright E2E (UI) tests. Tests live in ./e2e
  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    container_name: my_playwright
    working_dir: /e2e
    env_file:
      # committed defaults; optional local file overrides them
      - path: .env.e2e.example
      - path: .env.e2e
        required: false
    environment:
      # localhost-proxy.js forwards :5173 and :3000 to the frontend and app services
      - BASE_URL=http://localhost:5173
      - CI=true
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
    # proxy always starts first, so any overridden command (UI mode, --grep, ...) works too
    entrypoint: ["sh", "-c", "node localhost-proxy.js & exec \"$$@\"", "--"]
    command: sh -c "npm ci && npx playwright test"
    profiles:
      - e2e

volumes:
  db_data: